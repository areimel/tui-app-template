name: Microsite

on:
  push:
    branches: [main]
    paths:
      [
        'site/**',
        'source/app.config.ts',
        'pnpm-lock.yaml',
        '.github/workflows/site.yml',
      ]
  pull_request:
    paths:
      [
        'site/**',
        'source/app.config.ts',
        'pnpm-lock.yaml',
        '.github/workflows/site.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      # One workspace install covers the app and the site. The site build
      # resolves the root tsconfig.json, which extends @sindresorhus/tsconfig,
      # and imports source/app.config.ts, so root dependencies must be present.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check && pnpm run check
        working-directory: site
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: site
      # Playwright builds the site itself (with a dummy form key for tests), so build the
      # deployable output afterwards with the real values. These are repository variables, not
      # secrets: they end up in the HTML. Unset PUBLIC_WEB3FORMS_KEY hides the contact form.
      # PUBLIC_GTM_ID is deliberately not passed: an unset variable expands to "", which would
      # disable the tag; the default lives in site/src/config/site.config.ts.
      - run: pnpm run test:e2e
        working-directory: site
      - run: pnpm run build
        working-directory: site
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
